# Maintainer only: copy this file to `.github/workflows/ci.yml` on your **challenge branch**
# (do NOT replace main with this — main must keep the fixed workflow).
#
# Bug: `npm` runs before Node is installed → job fails (e.g. exit 127, npm not found).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
